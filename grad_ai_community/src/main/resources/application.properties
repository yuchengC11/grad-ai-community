# 数据源配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/gradaicommunity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
server.port=8081

# Hikari 连接池配置，解决连接超时断开
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# 连接最大存活时间 30 分钟，小于 MySQL 默认 8 小时超时
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

#上传文件本地目录，可以写相对或者绝对路径
upload.local-path=./uploads

# JWT配置，支持环境变量注入，本地提供兜底默认密钥
jwt.secret=${JWT_SECRET:gradaicommunity_secret_key_2026}
jwt.expire-ms=604800000

#静态资源映射
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.graduate.graidaicommunity.pojo
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
logging.level.com.graduate.graidaicommunity.mapper=debug
mybatis-plus.global-config.db-config.id-type=auto

#OpenAI/阿里云 DashScope配置
openai.api.key=${DASHSCOPE_API_KEY:}
openai.base.url=https://ws-3n8u5bfgjuje7o5l.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
openai.model=qwen3.7-plus
openai.temperature=0.3
#HTTP超时
openai.connect-timeout=10000
openai.read-timeout=60000

# Redis配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# ================== Resilience4j 熔断配置 ==================
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=com.graduate.graidaicommunity.common.AiException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=java.io.IOException
resilience4j.circuitbreaker.configs.default.record-exceptions[2]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.dashscope.base-config=default

# ================== Resilience4j 限流配置 ==================
resilience4j.ratelimiter.configs.default.limit-for-period=5
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0
resilience4j.ratelimiter.instances.dashscope.base-config=default
